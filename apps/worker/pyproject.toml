[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kiwoom-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "websockets>=15,<18",
  "httpx>=0.28,<0.29",
  "psycopg[binary]>=3.3,<3.4",
]

[dependency-groups]
dev = [
  "pytest>=9",
  "pytest-asyncio>=1.4",
  "ruff>=0.17",
]

[project.scripts]
kiwoom-worker = "kiwoom_worker.main:cli"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["db: needs local Supabase"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
